server {
  listen 4201;
  root /usr/share/nginx/html;
  absolute_redirect off;

  # Se sirve bajo /mfe-gestion/ (igual que por el gateway), así funciona directo en http://localhost:4201/mfe-gestion/
  location = / { return 302 /mfe-gestion/; }

  # El Shell lee remoteEntry.json en cada carga: siempre la versión nueva
  location = /mfe-gestion/remoteEntry.json { add_header Cache-Control "no-cache"; }

  location /mfe-gestion/ {
    try_files $uri $uri/ /mfe-gestion/index.html;
  }
}
