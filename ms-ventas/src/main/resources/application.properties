spring.application.name=ms-ventas
# Fuera de Docker lee las variables de .env (en Docker no existe y se usan las del compose)
spring.config.import=optional:file:.env[.properties]
server.port=8080
# Detrás de Nginx: respeta X-Forwarded-* (Swagger arma bien las URLs con /api/ventas)
server.forward-headers-strategy=framework

# Base de datos: Supabase (variables de .env)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${POSTGRES_DB}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# El pooler de Supabase admite pocas conexiones simultáneas
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway crea y versiona el esquema a partir de db/V*__*.sql
spring.flyway.locations=classpath:db/migration

# Keycloak: emisor público del token y claves por la red interna
keycloak.issuer=${KEYCLOAK_ISSUER:http://localhost/auth/realms/licoreria}
keycloak.jwks=${KEYCLOAK_JWKS:http://localhost/auth/realms/licoreria/protocol/openid-connect/certs}

# Orígenes permitidos para CORS, separados por coma (vacío = sin CORS; detrás de Nginx no hace falta)
cors.origins=${CORS_ORIGINS:}

# Servicios que llama la Saga
inventario.url=${INVENTARIO_URL:http://localhost/api/inventario}
gestion.url=${GESTION_URL:http://localhost/graphql}

# GET /health (actuator expuesto en la raíz)
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,flyway
# GET /flyway (requiere token) muestra las migraciones aplicadas en la base
management.endpoint.health.show-details=always

# Swagger UI en /swagger-ui.html (por Nginx: /api/ventas/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
