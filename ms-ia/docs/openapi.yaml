# Contrato de ms-ia. Publicado por Nginx en /api/ia. Todo excepto /health exige Authorization: Bearer <token>.
# Implementado (semana 2 y semana 3): /health, /yo, /imagen/clasificar, /video/analizar, /modelos/latest,
# /modelos/{version}/{archivo}, /mcp/tools, /mcp/tools/{nombre}, /reportes, /agentes/reabastecimiento.
# Errores: { codigo, mensaje } — NO_AUTENTICADO (401), SIN_PERMISO (403), DATOS_INVALIDOS (400),
# MODELO_NO_DISPONIBLE (503, todavía no hay modelo entrenado), ERROR_INTERNO (502, ms-inventario no respondió).
openapi: 3.0.3
info:
  title: ms-ia
  version: 1.0.0
  description: Clasificación de productos (TensorFlow / TFLite / TF.js), extracción de frames con OpenCV, agentes LangGraph y servidor FastMCP.
servers:
  - url: http://localhost/api/ia
    description: A través de Nginx
  - url: http://localhost:8002
    description: Directo al servicio
  - url: http://ms-ia:8002
    description: Red interna de Docker (servicio a servicio)
security:
  - bearer: []
paths:
  /health:
    get:
      summary: Estado del servicio y de Ollama
      security: []
      responses:
        "200": { description: OK }
  /yo:
    get:
      summary: Usuario del token (id, usuario y roles de Keycloak)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  usuario: { type: string }
                  roles: { type: array, items: { type: string } }
        "401": { description: Falta el token o no es válido }
  /imagen/clasificar:
    post:
      summary: Clasifica una foto de producto (CU04). Roles CAJERO, ALMACEN o GERENTE
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagen]
              properties:
                imagen: { type: string, format: binary, description: JPG o PNG, hasta 8 MB }
      responses:
        "200":
          description: Producto reconocido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Prediccion" }
        "400": { description: Imagen vacía, ilegible o mayor a 8 MB (DATOS_INVALIDOS) }
        "401": { description: NO_AUTENTICADO }
        "403": { description: SIN_PERMISO }
        "503": { description: Todavía no hay modelo entrenado (MODELO_NO_DISPONIBLE) }
  /video/analizar:
    post:
      summary: Extrae 1 frame por segundo y clasifica cada uno (CU04)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video: { type: string, format: binary }
      responses:
        "200":
          description: Productos detectados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Prediccion" }
  /modelos/latest:
    get:
      summary: Versión vigente del clasificador y URLs para descargarlo (la app y el POS lo usan offline)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: "20261025-060236" }
                  entrenadoEn: { type: string, format: date-time }
                  etiquetas: { type: array, items: { type: string }, example: [absolut_750, casareal_negra, huari_620, jw_red, pacena_620] }
                  precisionValidacion: { type: number, example: 0.93 }
                  tflite: { type: string, example: "http://localhost/api/ia/modelos/20261025-060236/modelo.tflite" }
                  tfjs: { type: string, nullable: true, description: "null si el modelo no se exportó a TF.js" }
        "503": { description: Todavía no hay modelo entrenado (MODELO_NO_DISPONIBLE) }
  /modelos/{version}/{archivo}:
    get:
      summary: Descarga un archivo del modelo (modelo.tflite, etiquetas.txt, tfjs/model.json, …)
      parameters:
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: archivo, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: El archivo }
        "404": { description: No existe (NO_ENCONTRADO) }
  /mcp/tools:
    get:
      summary: Lista las herramientas MCP registradas para los agentes LangGraph
      responses:
        "200":
          description: Catálogo de herramientas MCP
          content:
            application/json:
              schema:
                type: object
                properties:
                  servidor: { type: string, example: "ms-ia-mcp" }
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        nombre: { type: string }
                        descripcion: { type: string }
  /mcp/tools/{nombre}:
    post:
      summary: Ejecuta una tool MCP reenviando el JWT Bearer del llamador
      parameters:
        - { name: nombre, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                argumentos: { type: object }
      responses:
        "200":
          description: Resultado de la tool MCP
  /reportes:
    post:
      summary: Agente de reportes por lenguaje natural con LangGraph + Ollama (CU07)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [consulta]
              properties:
                consulta: { type: string, example: "Ventas por producto de esta semana en barras" }
                desde: { type: string, format: date, nullable: true }
                hasta: { type: string, format: date, nullable: true }
      responses:
        "200":
          description: Datos para graficar
          content:
            application/json:
              schema:
                type: object
                properties:
                  columnas: { type: array, items: { type: string } }
                  datos: { type: array, items: { type: array, items: {} } }
                  tipoGrafico: { type: string, enum: [barras, lineas, torta, tabla] }
                  resumen: { type: string }
                  interpretadoPor: { type: string, enum: [llm, reglas], description: Quién interpretó el pedido }
                  reporteId: { type: string, nullable: true }
  /agentes/reabastecimiento:
    post:
      summary: Agente de reabastecimiento con LangGraph + Ollama; lo llama n8n con el aviso de stock bajo (CU06)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [productoCodigo]
              properties:
                productoCodigo: { type: string, example: "CER-001" }
                nombre: { type: string, nullable: true, example: "Cerveza Paceña 620 ml" }
                cantidad: { type: integer, example: 8 }
                minimo: { type: integer, example: 20 }
      responses:
        "200":
          description: Resultado del agente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ordenCreada: { type: boolean }
                  motivo: { type: string }
                  decididoPor: { type: string, enum: [llm, reglas], description: "llm salvo que Ollama falle o tarde demasiado" }
                  herramientasUsadas: { type: array, items: { type: string }, description: Tools MCP que eligió el agente }
                  numero: { type: string, nullable: true }
                  lineas: { type: array, items: { type: object } }
                  motivo: { type: string, nullable: true }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Prediccion:
      type: object
      properties:
        productoCodigo: { type: string, nullable: true, example: CER-001, description: "null si la etiqueta no está en el catálogo" }
        nombre: { type: string, nullable: true, example: "Cerveza Paceña 620 ml" }
        etiqueta: { type: string, example: pacena_620, description: etiquetaModelo del catálogo }
        confianza: { type: number, format: float, example: 0.9744 }
        modelo: { type: string, example: "20261025-060236", description: versión del modelo que clasificó }
