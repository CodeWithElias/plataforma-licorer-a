events {}

http {
  # DNS interno de Docker. Con proxy_pass por variable, Nginx resuelve cada servicio
  # al llegar la petición: si un servicio aún no existe responde 502 en lugar de no arrancar.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    # Encabezados para todos los servicios. No se repiten dentro de los location: si un location define
    # algún proxy_set_header, Nginx deja de heredar estos.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    # Prefijo con el que el gateway publica el servicio (lo usan Swagger/OpenAPI); vacío = no se envía
    set $prefijo "";
    proxy_set_header X-Forwarded-Prefix $prefijo;

    # APIs. Proxy inverso: Nginx llama él mismo a la URL real del servicio (red interna de Docker)
    # y devuelve la respuesta; el navegador solo ve http://localhost.
    location /auth/ {
      set $up keycloak:8080;
      proxy_pass http://$up;                         # se conserva /auth/...
      proxy_buffer_size 128k;                        # cabeceras grandes de Keycloak
      proxy_buffers 4 256k;
    }
    location /api/ventas/ {                          # /api/ventas/x → http://ms-ventas:8080/x
      set $up ms-ventas:8080;
      set $prefijo /api/ventas;
      rewrite ^/api/ventas/(.*)$ /$1 break;
      proxy_pass http://$up;
    }
    location /api/inventario/ {                      # /api/inventario/x → http://ms-inventario:8001/x
      set $up ms-inventario:8001;
      set $prefijo /api/inventario;
      rewrite ^/api/inventario/(.*)$ /$1 break;
      proxy_pass http://$up;
    }
    location /api/ia/ {                              # /api/ia/x → http://ms-ia:8002/x
      set $up ms-ia:8002;
      set $prefijo /api/ia;
      rewrite ^/api/ia/(.*)$ /$1 break;
      proxy_pass http://$up;
    }
    location /graphql {                              # /graphql → http://ms-gestion:3000/graphql
      set $up ms-gestion:3000;
      proxy_pass http://$up;
    }

    # Frontends (el Shell carga los remotos desde /mfe-pos/ y /mfe-gestion/; cada uno conserva su prefijo)
    location /mfe-pos/ {
      set $up mfe-pos:4202;
      proxy_pass http://$up;
    }
    location /mfe-gestion/ {
      set $up mfe-gestion:4201;
      proxy_pass http://$up;
    }
    location / {
      set $up web-shell:4200;
      proxy_pass http://$up;
    }
  }
}
