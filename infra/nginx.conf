events {}

http {
  # DNS interno de Docker. Con proxy_pass por variable, Nginx resuelve cada servicio
  # al llegar la petición: si un servicio aún no existe responde 502 en lugar de no arrancar.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # APIs
    location /auth/ {
      set $up keycloak:8080;
      proxy_pass http://$up;                         # se conserva /auth/...
      proxy_buffer_size 128k;                        # cabeceras grandes de Keycloak
      proxy_buffers 4 256k;
    }
    location /api/ventas/ {
      set $up ms-ventas:8080;
      rewrite ^/api/ventas/(.*)$ /$1 break;
      proxy_pass http://$up;
    }
    location /api/inventario/ {
      set $up ms-inventario:8000;
      rewrite ^/api/inventario/(.*)$ /$1 break;
      proxy_pass http://$up;
    }
    location /api/ia/ {
      set $up ms-ia:8000;
      rewrite ^/api/ia/(.*)$ /$1 break;
      proxy_pass http://$up;
    }
    location /graphql {
      set $up ms-gestion:3000;
      proxy_pass http://$up;                         # se conserva /graphql
    }

    # Frontends (el Shell carga los remotos desde /mfe-pos/ y /mfe-gestion/)
    location /mfe-pos/ {
      set $up mfe-pos:80;
      rewrite ^/mfe-pos/(.*)$ /$1 break;
      proxy_pass http://$up;
    }
    location /mfe-gestion/ {
      set $up mfe-gestion:80;
      rewrite ^/mfe-gestion/(.*)$ /$1 break;
      proxy_pass http://$up;
    }
    location / {
      set $up web-shell:80;
      proxy_pass http://$up;
    }
  }
}
