# Plataforma Licorería – entorno completo (monorepo)
#   sh infra/crear-env.sh                           primera vez: crea cada <proyecto>/.env desde su .env.example
#   docker compose run --rm mongo-init              primera vez por cluster de Atlas: colecciones e índices de ms-gestion
#   docker compose up -d --build                    todo el sistema
#   docker compose up -d --build ms-ventas nginx    solo lo que nombras (y sus dependencias)
#   docker compose --profile llm up -d ollama       LLM local para los agentes de ms-ia (imagen grande)
#
# Puertos: cada servicio tiene uno propio, igual dentro y fuera de Docker (ver README). El frontend entra
# siempre por el gateway (nginx :80); los puertos directos sirven para probar cada servicio por separado.
#
# Cada servicio lee su configuración de SU .env (env_file). Aquí no hay claves: en "environment" solo se
# cambian las direcciones de red internas, porque dentro de Docker los servicios se llaman por nombre
# (keycloak:8080, ms-inventario:8000...) y no por localhost como en el .env.
name: licoreria

services:
  # ---------- Bases de datos ----------
  # PostgreSQL de ms-ventas y de Keycloak: Supabase · MongoDB de ms-gestion: Atlas (en la nube, ver cada .env)
  # DynamoDB: local
  dynamodb:
    image: amazon/dynamodb-local
    command: "-jar DynamoDBLocal.jar -sharedDb"
    ports: ["8000:8000"]

  dynamodb-init:                       # crea las tablas y se apaga (credenciales de ms-inventario/.env)
    image: amazon/aws-cli
    depends_on: [dynamodb]
    env_file: ./ms-inventario/.env
    environment:
      DYNAMO_URL: http://dynamodb:8000
    entrypoint: ["/bin/sh", "/init/inventario.sh"]
    volumes: ["./ms-inventario/db/inventario.sh:/init/inventario.sh:ro"]

  mongo-init:                          # solo a mano: docker compose run --rm mongo-init
    # Aplica ms-gestion/db/gestion.js en Atlas (colecciones, validadores e índices) y se apaga.
    # Se ejecuta una vez por cluster o cuando cambia gestion.js; no corre con "docker compose up".
    profiles: [setup]
    image: mongo:7
    env_file: ./ms-gestion/.env
    entrypoint: ["sh", "-c", "mongosh \"$$MONGO_URL\" --quiet /init/gestion.js"]
    volumes: ["./ms-gestion/db/gestion.js:/init/gestion.js:ro"]

  # ---------- Seguridad y gateway ----------
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    # infra/.env: base (Supabase) y admin. Los secretos de los clientes los toma del .env de quien los usa
    # (realm-licoreria.json usa ${KEYCLOAK_ADMIN_CLIENT_SECRET}, ${N8N_CLIENT_SECRET} y ${VENTAS_CLIENT_SECRET}).
    env_file: [./infra/.env, ./ms-gestion/.env, ./n8n/.env, ./ms-ventas/.env]
    environment:
      KC_DB: postgres
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost/auth   # emisor fijo del token
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - "./infra/keycloak:/opt/keycloak/data/import:ro"                       # realm-licoreria.json
      - "./infra/keycloak-tema/licoreria:/opt/keycloak/themes/licoreria:ro"   # tema blanco y lila

  nginx:
    image: nginx:stable
    ports: ["80:80"]
    volumes: ["./infra/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [keycloak]               # el resto se resuelve al llegar la petición (ver infra/nginx.conf)

  # ---------- Dev 1 ----------
  ms-ventas:
    build: ./ms-ventas
    env_file: ./ms-ventas/.env
    ports: ["8080:8080"]
    environment:
      KEYCLOAK_JWKS: http://keycloak:8080/auth/realms/licoreria/protocol/openid-connect/certs
      INVENTARIO_URL: http://ms-inventario:8001
      GESTION_URL: http://ms-gestion:3000/graphql
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/auth/realms/licoreria/protocol/openid-connect/token
    depends_on: [keycloak]

  ms-inventario:
    build: ./ms-inventario
    env_file: ./ms-inventario/.env
    ports: ["8001:8001"]
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      KEYCLOAK_JWKS: http://keycloak:8080/auth/realms/licoreria/protocol/openid-connect/certs
      N8N_WEBHOOK_STOCK_BAJO: http://n8n:5678/webhook/stock-bajo
    depends_on:
      dynamodb-init: { condition: service_completed_successfully }
      keycloak: { condition: service_started }

  n8n:
    image: n8nio/n8n
    env_file: ./n8n/.env
    ports: ["5678:5678"]
    volumes: ["n8n-data:/home/node/.n8n", "./n8n/workflows:/workflows"]

  # ---------- Dev 2 ----------
  ms-gestion:
    build: ./ms-gestion
    env_file: ./ms-gestion/.env
    ports: ["3000:3000"]
    environment:
      KEYCLOAK_JWKS: http://keycloak:8080/auth/realms/licoreria/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_URL: http://keycloak:8080/auth
    depends_on: [keycloak]

  web-shell:
    build: ./web-shell
    ports: ["4200:4200"]

  mfe-gestion:
    build: ./mfe-gestion
    ports: ["4201:4201"]

  mfe-pos:
    build: ./mfe-pos                     # usa mfe-pos/.env al compilar (variables VITE_*)
    ports: ["4202:4202"]

  # ---------- Dev 3 ----------
  ms-ia:
    build: ./ms-ia
    env_file: ./ms-ia/.env
    ports: ["8002:8002"]
    volumes: ["./ms-ia/modelos:/app/modelos"]   # modelos entrenados (entrenamiento/entrenar.py)
    environment:
      OLLAMA_URL: http://ollama:11434
      KEYCLOAK_JWKS: http://keycloak:8080/auth/realms/licoreria/protocol/openid-connect/certs
      VENTAS_URL: http://ms-ventas:8080
      INVENTARIO_URL: http://ms-inventario:8001
      GESTION_URL: http://ms-gestion:3000/graphql
    depends_on: [keycloak]

  ollama:
    profiles: [llm]
    image: ollama/ollama
    volumes: ["ollama-data:/root/.ollama"]

volumes:
  n8n-data: {}
  ollama-data: {}
