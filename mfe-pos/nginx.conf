server {
  listen 80;
  root /usr/share/nginx/html;

  # El Web Component lo pide el Shell; el service worker siempre fresco
  location = /pos-element.js { add_header Cache-Control "no-cache"; }
  location = /sw.js          { add_header Cache-Control "no-cache"; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
