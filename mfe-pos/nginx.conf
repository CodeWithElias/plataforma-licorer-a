server {
  listen 4202;
  root /usr/share/nginx/html;
  absolute_redirect off;

  # Se sirve bajo /mfe-pos/ (igual que por el gateway), así funciona directo en http://localhost:4202/mfe-pos/
  location = / { return 302 /mfe-pos/; }

  # El Web Component lo pide el Shell; el service worker siempre fresco
  location = /mfe-pos/pos-element.js { add_header Cache-Control "no-cache"; }
  location = /mfe-pos/sw.js          { add_header Cache-Control "no-cache"; }

  location /mfe-pos/ {
    try_files $uri $uri/ /mfe-pos/index.html;
  }
}
